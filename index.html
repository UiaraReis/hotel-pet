<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Sistema de Gerenciamento</title>
</head>
<body>
    <header>
        <h1>Hotel Pet - Painel de Controle</h1>
        <nav>
            <ul>
                <li><a href="#reservas">Reservas</a></li>
                <li><a href="#pets">Pets</a></li>
                <li><a href="#usuarios">Usuários</a></li>
                <li><a href="#configuracoes">Configurações</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="reservas">
            <h2>Gerenciamento de Reservas</h2>
            <!-- Campo de busca da Semana 2 -->
            <input type="text" id="campoBusca" placeholder="Pesquisar reserva..." onkeyup="realizarBusca()">

            <!-- Tabela de Reservas (Semana 3) -->
            <table border="1" id="tabelaReservas">
                <thead>
                <tr>
                    <th>Pet</th>
                    <th>Tutor</th>
                    <th>Acomodação</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr class="item-lista">
                    <td>Thor</td>
                    <td>Alexia</td>
                    <td>Box Premium</td>
                    <td><button onclick="editarReserva(this)">Editar</button></td>
                </tr>
                <tr class="item-lista">
                    <td>Mel</td>
                    <td>Isadora</td>
                    <td>Suíte Felina</td>
                    <td><button onclick="editarReserva(this)">Editar</button></td>
                </tr>
                <tr class="item-lista">
                    <td>Rex</td>
                    <td>Lexia</td>
                    <td>Quarto Standard</td>
                    <td><button onclick="editarReserva(this)">Editar</button></td>
                </tr>
                </tbody>
            </table>
            <p>Visão de controle para clientes, funcionários e gerentes.</p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
